[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-risk-project"
version = "0.1.0"
description = "Production-Grade Snowflake Snowpark Data Pipeline & Risk Analytics Framework"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "snowflake-snowpark-python[pandas]>=1.11.0",
    "snowflake-connector-python>=3.6.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "abor_risk",
]

[tool.ruff]
line-length = 100
target-version = "py310"
